<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — Ferretería República</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #F8FAFC; color: #0F172A; display: flex; align-items: center;
      justify-content: center; padding: 24px; text-align: center; }
    .card { max-width: 420px; width: 100%; background: #FFFFFF; border: 1px solid #E2E8F0;
      border-radius: 16px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(15,23,42,.06); }
    .logo { width: 72px; height: 72px; margin: 0 auto 18px; display: block; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; color: #0B3A3D; }
    p { margin: 0 0 20px; color: #475569; line-height: 1.5; font-size: .95rem; }
    button { appearance: none; border: 0; cursor: pointer; background: #4FAEB2; color: #fff;
      font-weight: 600; font-size: .95rem; padding: 12px 20px; border-radius: 10px; width: 100%; }
    .hint { margin-top: 14px; font-size: .8rem; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icons/icon-192.png" alt="Ferretería República" />
    <h1>Sin conexión</h1>
    <p>Esta pantalla todavía no está disponible sin internet. Abrila una vez con conexión y quedará guardada.</p>
    <button onclick="location.reload()">Reintentar</button>
    <div class="hint">Ferretería República · Zentra</div>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
